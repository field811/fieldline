<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Field Line</title>
  <meta name="description" content="Recovery, strain and sleep scores from your Apple Health data. Everything stays on your phone.">
  <meta name="theme-color" content="#0b0f14">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Field Line">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 20" aria-hidden="true"><polyline points="1,11 11,11 15,3 21,18 25,11 39,11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Field Line
    </div>
    <button class="nav" id="prev" aria-label="Previous day">‹</button>
    <div class="date">
      <div id="dateLabel">Today</div>
      <div class="sub" id="dateSub"></div>
    </div>
    <button class="nav" id="next" aria-label="Next day">›</button>
  </header>

  <main id="view"></main>
  <input type="file" id="syncFile" accept=".txt,.json,text/plain" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <nav class="tabs">
    <button data-tab="today" class="on"><span>◎</span>Today</button>
    <button data-tab="sleep"><span>☾</span>Sleep</button>
    <button data-tab="trends"><span>▤</span>Trends</button>
    <button data-tab="settings"><span>⚙</span>Settings</button>
  </nav>

  <script type="module" src="js/app.js"></script>
</body>
</html>
